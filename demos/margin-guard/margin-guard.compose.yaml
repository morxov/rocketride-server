# Local services for the AI Margin Guard demo: Redis (live state, 127.0.0.1:6379)
# and Postgres (audit log, 127.0.0.1:5433). Removing the containers deletes the data.
services:
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  margin-guard-db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: margin_guard
      POSTGRES_PASSWORD: ${ROCKETRIDE_MG_PG_PASSWORD:?set in .env}
      POSTGRES_DB: margin_guard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin_guard -d margin_guard"]
      interval: 2s
      timeout: 2s
      retries: 20
